# Example manifest for deploying wwstatsbot to Kubernetes.
# As written the bot long-polls (no inbound traffic), so no Service/Ingress is
# needed — the exposed port is only for the health probes.
#
# For a webhook deployment, add WEBHOOK_URL (the public base URL Telegram should
# call) and put a Service/Ingress in front of this same port: the update path is
# served next to /healthz on HEALTH_PORT, so one port covers both. WEBHOOK_SECRET
# is generated per pod when unset, which is fine for a single replica; set it
# explicitly if you scale beyond one, since each pod would otherwise register its
# own secret and only the last one to start would be accepted by Telegram.
#
# Create the secret first (DATABASE_URL points at your external Postgres):
#   kubectl create secret generic wwstatsbot \
#     --from-literal=BOT_TOKEN='123456789:ABC...' \
#     --from-literal=DATABASE_URL='postgresql://user:pass@host:5432/wwstatsbot' \
#     --from-literal=SUPERUSER_ID='123456789' \
#     --from-literal=LOG_GROUP_ID='-1001234567890'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wwstatsbot
  labels:
    app: wwstatsbot
spec:
  replicas: 1            # polling bot — do NOT scale >1 (would double-process updates)
  strategy:
    type: Recreate       # avoid two pods polling at once during rollout
  selector:
    matchLabels:
      app: wwstatsbot
  template:
    metadata:
      labels:
        app: wwstatsbot
    spec:
      containers:
        - name: wwstatsbot
          image: wwstatsbot:latest   # replace with your registry/image:tag
          env:
            - name: BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: wwstatsbot
                  key: BOT_TOKEN
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: wwstatsbot
                  key: DATABASE_URL
            - name: SUPERUSER_ID
              valueFrom:
                secretKeyRef:
                  name: wwstatsbot
                  key: SUPERUSER_ID
            - name: LOG_GROUP_ID
              valueFrom:
                secretKeyRef:
                  name: wwstatsbot
                  key: LOG_GROUP_ID
            - name: HEALTH_PORT
              value: "8080"
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
