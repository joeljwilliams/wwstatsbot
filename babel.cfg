# Extraction config for pybabel.
#
# Only templates.py is scanned, because it is the only place user-visible prose lives —
# a property the suite enforces (tests/test_templates.py::test_no_prose_outside_templates).
# Scanning it alone keeps the .pot free of the strings that must NOT be translated: the
# error-text matchers in handlers/errors.py, the achievement-row regex, and Postgres' own
# "NULL" in the /db console.
#
# N_ is in pybabel's default keyword set, so no -k flag is needed.
[python: templates.py]
